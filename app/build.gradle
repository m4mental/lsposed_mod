plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.dynamicisland'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.dynamicisland"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        // 🟢 केवल लोकल सिस्टम के लिए कस्टम कीस्टोर कॉन्फ़िगरेशन
        localDebugConfig {
            def keystoreFile = rootProject.file("debug.keystore")
            if (keystoreFile.exists()) {
                storeFile = keystoreFile
                storePassword = "android"
                keyAlias = "androiddebugkey"
                keyPassword = "android"
            }
        }
    }

    buildTypes {
        debug {
            // 🟢 यदि 'debug.keystore' मौजूद है, तो उसका उपयोग करें।
            // यदि गिटहब रनर पर मौजूद नहीं है, तो बिना एरर के डिफ़ॉल्ट "debug" कीस्टोर पर फॉलबैक करें (Option A)
            def keystoreFile = rootProject.file("debug.keystore")
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.localDebugConfig
            } else {
                signingConfig signingConfigs.debug
            }
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // केवल Xposed API की आवश्यकता है
    compileOnly 'de.robv.android.xposed:api:82'
}
