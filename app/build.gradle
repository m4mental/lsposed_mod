plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.dynamicisland'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.dynamicisland"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            // प्रोजेक्ट के रूट फ़ोल्डर में कीस्टोर जाँचे
            def keystoreFile = rootProject.file("debug.keystore")
            if (keystoreFile.exists()) {
                storeFile = keystoreFile
                storePassword = "android"
                keyAlias = "androiddebugkey"
                keyPassword = "android"
            }
            // यदि फ़ाइल मौजूद नहीं है, तो डिफ़ॉल्ट ~/.android/debug.keystore का उपयोग जारी रहेगा!
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // केवल Xposed API की आवश्यकता है
    compileOnly 'de.robv.android.xposed:api:82'
}
