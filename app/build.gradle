plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example' // 🟢 आपके ओरिजिनल कोड पैकेज 'com.example' से मिलान करने के लिए
    compileSdk 34

    defaultConfig {
        applicationId "com.example"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        localDebugConfig {
            def keystoreFile = rootProject.file("debug.keystore")
            if (keystoreFile.exists()) {
                storeFile = keystoreFile
                storePassword = "android"
                keyAlias = "androiddebugkey"
                keyPassword = "android"
            }
        }
    }

    buildTypes {
        debug {
            def keystoreFile = rootProject.file("debug.keystore")
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.localDebugConfig
            } else {
                signingConfig signingConfigs.debug
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 🟢 Jetpack Compose फीचर्स को इनेबल करने के लिए
    buildFeatures {
        compose true
    }

    // 🟢 कोटलिन 1.9.22 के लिए पूरी तरह अनुकूल कंपोज कंपाइलर वर्शन
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // 🟢 MODERN LIBXPOSED API (जो आपकी वास्तविक कोटलिन फाइलें उपयोग कर रही हैं)
    compileOnly 'io.github.libxposed:api:100'

    // 🟢 JETPACK COMPOSE और मुख्य ANDROIDX डिपेंडेंसीज़ (जो कम्पाइलेशन सफल बनाएंगी)
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // Jetpack Compose BOM (Bill of Materials)
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
