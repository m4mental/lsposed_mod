name: Build LSPosed Module

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. AGP 9.1.1 के लिए आवश्यक Java 21 (JDK 21) सेटअप करें
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 2. AGP 9.1.1 के लिए संगत नवीनतम Gradle 9.1.0 सेटअप
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.1.0'

    # 3. सीधे ग्लोबल 'gradle' कमांड से क्लीन बिल्ड करें (वर्शन क्लैश को पूरी तरह रोकने के लिए)
    - name: Build with Gradle
      run: gradle :app:assembleDebug --no-configuration-cache --stacktrace --info

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LSPosed-DynamicIsland-Debug
        path: app/build/outputs/apk/debug/*.apk
