name: Build LSPosed Module (No Wrapper)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # GitHub Actions में सीधे बिना Wrapper के निर्दिष्ट वर्शन का Gradle सेटअप करें
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    # सीधे ग्लोबल 'gradle' कमांड चलाएं, './gradlew' की आवश्यकता नहीं है
    - name: Build with Gradle
      run: gradle assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LSPosed-DynamicIsland-Release
        path: app/build/outputs/apk/release/*.apk
