name: Build LSPosed Module

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. AGP 8.2.2 के लिए आवश्यक कंपैटिबल Java 17 (JDK 17) सेटअप
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 2. Setup Gradle (8.5 वर्शन का सीधे सेटअप ताकि कंपाइलर अलाइन रहे)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    # 3. यदि आपके प्रोजेक्ट रूट में 'gradlew' फाइलें गायब हैं, तो उन्हें यहाँ क्लाउड पर जनरेट करें (बग फिक्स!)
    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. बिना configuration cache टकराव के './gradlew' (Wrapper) से कंपाइल करें
    - name: Build with Gradle
      run: ./gradlew :app:assembleDebug --no-configuration-cache --stacktrace --info

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LSPosed-DynamicIsland-Debug
        path: app/build/outputs/apk/debug/*.apk
