name: Build LSPosed Module

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. AGP 9.1.1+ के लिए आवश्यक JDK 21 का सुचारू सेटअप
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      # 2. AGP 9.1.1 के लिए संगत नवीनतम Gradle 9.3.1 का सेटअप (FIXED!)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # 3. सीधे ग्लोबल 'gradle' कमांड से बिना कॉन्फ़िगरेशन कैशिंग टकराव के क्लीन बिल्ड करें
      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-configuration-cache --stacktrace --info

      # 4. तैयार किए गए डिबग एपीके को गिटहब आर्टिफैक्ट के रूप में अपलोड करें
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlyphIsland-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
