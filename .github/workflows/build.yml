name: Build LSPosed Module

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # क्लाउड पर Gradle सेटअप करें
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    # Wrapper स्क्रिप्ट्स बनाएं
    - name: Generate Gradle Wrapper
      run: gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # एरर की सटीक पहचान के लिए स्टैकट्रेस के साथ बिल्ड करें
    - name: Build with Gradle
      run: ./gradlew assembleRelease --stacktrace --info

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LSPosed-DynamicIsland-Release
        path: app/build/outputs/apk/release/*.apk
