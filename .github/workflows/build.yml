name: Build LSPosed Module

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # पहले क्लाउड पर निर्दिष्ट वर्शन का Gradle सेटअप करें
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    # यह कमांड gradlew और gradle-wrapper.jar फाइलों को खुद-ब-खुद जेनरेट कर देगी
    - name: Generate Gradle Wrapper
      run: gradle wrapper

    # जेनरेट की गई gradlew को रन करने की परमिशन दें
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # अब ./gradlew कमांड बिना किसी एरर के काम करेगी
    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LSPosed-DynamicIsland-Release
        path: app/build/outputs/apk/release/*.apk
