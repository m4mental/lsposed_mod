name: Build LSPosed Module

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # AGP 9.1.1 और Android 16 के लिए संगत Gradle 8.10.2 सेटअप
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    # लोकल ग्रैडल रैपर जनरेट करें
    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.10.2

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # बिना कॉन्फ़िगरेशन कैशिंग टकराव के क्लीन बिल्ड करें
    - name: Build with Gradle
      run: ./gradlew :app:assembleDebug --no-configuration-cache --stacktrace --info

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LSPosed-DynamicIsland-Debug
        path: app/build/outputs/apk/debug/*.apk
