name: Build LSPosed Module

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. Java 21 (JDK 21) सेटअप करें (AGP 9.1.1 के लिए आवश्यक)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 2. Gradle 8.10.2 सेटअप
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    # 3. Gradle Wrapper जनरेट करें
    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.10.2

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. बिना configuration cache टकराव के assembleDebug कमांड से बिल्ड करें (Option A Fallback Active)
    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-configuration-cache --stacktrace --info

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LSPosed-DynamicIsland-Debug
        path: app/build/outputs/apk/debug/*.apk
