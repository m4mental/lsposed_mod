name: Build LSPosed Module

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 1. गिटहब रनर पर सीधे तौर पर नया Gradle 8.10.2 ग्लोबली सेटअप करें
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    # 2. सीधे ग्लोबल 'gradle' कमांड से क्लीन बिल्ड करें (यह चिकन-एंड-एग एरर को 100% रोकेगा)
    - name: Build with Gradle
      run: gradle :app:assembleDebug --no-configuration-cache --stacktrace --info

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LSPosed-DynamicIsland-Debug
        path: app/build/outputs/apk/debug/*.apk
